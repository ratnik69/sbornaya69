function showSheet(html){sheet.innerHTML='<div class="handle"></div>'+html;overlay.hidden=false;sheet.hidden=false;sheet.querySelector('.close')?.addEventListener('click',closeSheet)}function closeSheet(){sheet.hidden=true;overlay.hidden=true}overlay.onclick=closeSheet;
$('#filterOpen').onclick=()=>{let f=state.filters;showSheet(`<div class="sheet-head"><h2 id="sheetTitle">Фильтры</h2><button class="close" aria-label="Закрыть">×</button></div><label class="field">Цена до <span id="priceValue">${f.price===100000?'без ограничений':money(f.price)}</span><input id="priceRange" type="range" min="0" max="100000" step="1000" value="${f.price}"></label><label class="field">Город<select id="city">${['Все города','Москва','Санкт-Петербург','Казань'].map(v=>`<option ${f.city===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Опыт работы<select id="condition">${['Любое','От 3 лет','До 3 лет'].map(v=>`<option ${f.condition===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field">Сортировка<select id="sort">${['Рекомендуем','Сначала дешевле','Сначала дороже','Сначала новые'].map(v=>`<option ${f.sort===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary" id="apply">Показать объявления</button><button class="reset" id="resetFilters">Сбросить фильтры</button>`);$('#priceRange').oninput=e=>$('#priceValue').textContent=+e.target.value===100000?'без ограничений':money(+e.target.value);$('#apply').onclick=()=>{state.filters={price:+$('#priceRange').value,city:$('#city').value,condition:$('#condition').value,sort:$('#sort').value};closeSheet();render()};$('#resetFilters').onclick=()=>{resetAll();closeSheet()}};

$('#settingsOpen').onclick=()=>{showSheet(`<div class="sheet-head"><h2 id="sheetTitle">Настройки</h2><button class="close" aria-label="Закрыть">×</button></div><label class="field">Тема<select id="theme">${[['system','Как в системе'],['dark','Тёмная'],['light','Светлая']].map(([v,t])=>`<option value="${v}" ${state.theme===v?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><input type="checkbox" id="haptic" ${state.haptic?'checked':''}> Вибрация при действиях</label>`);$('#theme').onchange=e=>{state.theme=e.target.value;localStorage.setItem('theme',state.theme);setTheme()};$('#haptic').onchange=e=>{state.haptic=e.target.checked;localStorage.setItem('haptic',state.haptic)}};
$('#searchOpen').onclick=()=>{let page=$('#searchPage');page.hidden=false;const hist=JSON.parse(localStorage.getItem('searchHistory')||'[]');page.innerHTML=`<div class="search-header"><button id="searchBack" aria-label="Закрыть поиск">←</button><input id="searchInput" placeholder="Что будем искать?" aria-label="Поиск объявлений" value=""><button id="searchSubmit" aria-label="Искать">⌕</button></div><h3>${hist.length?'Недавние запросы':'Популярные запросы'}</h3><div id="suggestions"></div>`;const suggestions=hist.length?hist:['Нападающий','Вратарь','Защитник','Полузащитник'];$('#suggestions').replaceChildren(...suggestions.map(s=>{let b=document.createElement('button');b.className='suggestion';b.textContent='↗  '+s;b.onclick=()=>doSearch(s);return b}));$('#searchBack').onclick=()=>page.hidden=true;$('#searchSubmit').onclick=()=>doSearch($('#searchInput').value);$('#searchInput').onkeydown=e=>{if(e.key==='Enter')doSearch(e.target.value)};$('#searchInput').focus()};function doSearch(q){q=q.trim();state.query=q;state.category='Все';if(q){let hist=JSON.parse(localStorage.getItem('searchHistory')||'[]');localStorage.setItem('searchHistory',JSON.stringify([q,...hist.filter(x=>x!==q)].slice(0,6)))}$('#searchPage').hidden=true;render()}
